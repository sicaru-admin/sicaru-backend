services:
  meilisearch:
    profiles: ["legacy-search-manual-only"]
    image: getmeili/meilisearch:v1.6
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-}
    volumes:
      - meilisearch_data:/meili_data

volumes:
  meilisearch_data:
