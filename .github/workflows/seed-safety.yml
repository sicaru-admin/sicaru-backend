name: Seed safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seed-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests without a Medusa container or live database
        run: npm run test:unit
      - name: Build backend and Admin with generated Medusa types
        env:
          MEDUSA_DISABLE_TELEMETRY: "true"
        run: npm run build
      - name: Type check after generating Medusa types
        run: npx tsc --noEmit
